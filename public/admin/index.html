<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · CourtCase Clarity</title>
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body class="admin-body">
    <div id="login-screen" class="login-screen">
      <form id="login-form" class="login-card">
        <h1>Admin Giriş</h1>
        <p class="muted">Kullanıcı adı ve şifre ile devam edin.</p>
        <label>
          Kullanıcı adı
          <input name="username" required />
        </label>
        <label>
          Şifre
          <input name="password" type="password" required />
        </label>
        <button class="btn primary" type="submit">Giriş</button>
        <p id="login-error" class="error"></p>
      </form>
    </div>

    <div class="admin-shell">
      <aside class="sidebar">
        <div class="brand">
          <p class="eyebrow">CourtCase Clarity</p>
          <h2>Admin Panel</h2>
        </div>
        <nav class="menu">
          <button data-tab="cases" class="menu-item active">Davalar</button>
          <button data-tab="profiles" class="menu-item">Profiller</button>
        </nav>
        <div class="menu-footer">
          <button id="export-json" class="btn ghost">JSON Export</button>
          <label class="btn ghost">
            JSON Import
            <input id="import-json" type="file" accept="application/json" hidden />
          </label>
          <button id="logout" class="btn ghost">Çıkış</button>
        </div>
      </aside>

      <main class="content">
        <section class="panel tab-panel active-tab" id="tab-cases">
          <h2>Dava Oluştur</h2>
          <form id="case-form">
            <label>Dava başlığı<input name="title" required /></label>
            <label>İddianame Özeti<textarea name="summary" rows="3"></textarea></label>
            <div class="form-grid">
              <label>Esas No<input name="caseNumber" required /></label>
              <label>Mahkeme<input name="courtName" required /></label>
              <label>Savcı<input name="prosecutor" /></label>
              <label>Hakim<input name="judge" /></label>
            </div>
            <label>Heyet (virgülle ayır)<input name="panel" /></label>
            <div class="form-grid">
              <label>Tarih<input name="date" type="date" /></label>
              <label>Durum
                <select name="status">
                  <option value="Devam Ediyor">Devam Ediyor</option>
                  <option value="Karara Bağlandı">Karara Bağlandı</option>
                </select>
              </label>
            </div>
            <button class="btn primary" type="submit">Kaydet</button>
          </form>
          <div class="list" id="case-list"></div>
        </section>

        <section class="panel tab-panel" id="tab-profiles">
          <h2>Profil Ekle</h2>
          <div class="parser">
            <h3>Yapıştır ve Ayrıştır</h3>
            <textarea id="parse-input" rows="8" placeholder="Metni buraya yapıştırın..."></textarea>
            <label>Aktif dava seç
              <select id="active-case"></select>
            </label>
            <div class="parser-actions">
              <button id="parse-btn" class="btn primary" type="button">Ayrıştır</button>
              <button id="clear-btn" class="btn ghost" type="button">Temizle</button>
            </div>
            <div id="parse-results" class="list"></div>
          </div>
          <form id="profile-form">
            <label>İddianame Özeti<textarea name="summary" rows="3" readonly></textarea></label>
            <label>İsim Soyad / Ünvan<input name="name" required /></label>
            <label>Fotoğraf URL<input name="photo" placeholder="https://..." /></label>
            <label>Rol
              <select name="role">
                <option value="defendant">Sanık</option>
                <option value="informant">İtirafçı</option>
                <option value="witness">Tanık</option>
                <option value="secretWitness">Gizli Tanık</option>
                <option value="victim">Mağdur</option>
                <option value="fugitive">Firari</option>
                <option value="detained">Tutuklu</option>
              </select>
            </label>
            <div id="actions-container"></div>
            <label>Talep Edilen Ceza<input name="sentenceDemand" placeholder="5-12 yıl / 12 yıl" /></label>
            <button class="btn primary" type="submit">Kaydet</button>
          </form>
          <div class="list" id="profile-list"></div>
        </section>

      </main>
    </div>

    <script src="/admin/admin.js"></script>
  </body>
</html>
