<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · CourtCase Clarity</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/admin/admin.css" />
  </head>
  <body class="admin-body">
    <div id="login-screen" class="login-screen">
      <form id="login-form" class="login-card">
        <h1>Admin Giriş</h1>
        <p class="muted">Kullanıcı adı ve şifre ile devam edin.</p>
        <label>
          Kullanıcı adı
          <input name="username" required />
        </label>
        <label>
          Şifre
          <input name="password" type="password" required />
        </label>
        <button class="btn primary" type="submit">Giriş</button>
        <p id="login-error" class="error"></p>
      </form>
    </div>

    <div class="admin-shell">
      <aside class="sidebar">
        <div class="brand">
          <p class="eyebrow">CourtCase Clarity</p>
          <h2>Admin Panel</h2>
        </div>
        <nav class="menu">
          <button data-tab="cases" class="menu-item active">Davalar</button>
          <button data-tab="profiles" class="menu-item">Profiller</button>
          <a href="/" class="menu-item home-link">Ana Sayfaya Dön</a>
        </nav>
      </aside>

      <main class="content">
        <section class="panel tab-panel active-tab" id="tab-cases">
          <div class="form-mode-header">
            <h2 id="case-form-title">Dava Oluştur</h2>
            <button id="case-form-reset" class="btn ghost" type="button" style="display:none">+ Yeni Dava</button>
          </div>
          <form id="case-form">
            <input type="hidden" name="editId" />
            <label>Dava başlığı<input name="title" required /></label>
            <label>İddianame Özeti<textarea name="summary" rows="3"></textarea></label>
            <div class="form-grid">
              <label>Soruşturma No<input name="sorusturmaNo" placeholder="Örn: 2024/12345" /></label>
              <label>Esas No<input name="caseNumber" required /></label>
            </div>
            <div class="form-grid">
              <label>İddianame No<input name="iddianameNo" placeholder="Örn: 2024/901" /></label>
              <label>Mahkeme<input name="courtName" required /></label>
            </div>
            <div class="form-grid">
              <label>İddianame Savcısı<input name="indictmentProsecutor" /></label>
              <label>Duruşma Savcısı<input name="trialProsecutor" placeholder="(opsiyonel)" /></label>
            </div>
            <label>Hakim / Heyet
              <select name="judgeType" id="judge-type-select">
                <option value="single">Tek Hakim</option>
                <option value="panel">Heyet (Ağır Ceza)</option>
              </select>
            </label>
            <div id="judge-single-fields">
              <label>Hakim<input name="judgeName" /></label>
            </div>
            <div id="judge-panel-fields" style="display:none">
              <label>Heyet Başkanı<input name="panelPresident" /></label>
              <label>Üye Hakimler (virgülle ayır)<input name="panelMembers" placeholder="Hakim A, Hakim B" /></label>
            </div>
            <div class="form-grid">
              <label>İddianamenin Kabul Tarihi<input name="acceptanceDate" type="date" /></label>
              <label>Durum
                <select name="status">
                  <option value="Soruşturma">Soruşturma</option>
                  <option value="İddianame Aşamasında">İddianame Aşamasında</option>
                  <option value="Kovuşturma (Devam Ediyor)">Kovuşturma (Devam Ediyor)</option>
                  <option value="Karar Verildi">Karar Verildi</option>
                  <option value="İstinaf">İstinaf</option>
                  <option value="Temyiz">Temyiz</option>
                  <option value="Kesinleşti">Kesinleşti</option>
                </select>
              </label>
            </div>
            <div class="form-grid">
              <label>İddianame Tarihi<input name="indictmentDate" type="date" /></label>
              <label>Karar Tarihi<input name="verdictDate" type="date" /></label>
            </div>
            <button class="btn primary" type="submit" id="case-submit-btn">Kaydet</button>
          </form>
          <div class="list" id="case-list"></div>
        </section>

        <section class="panel tab-panel" id="tab-profiles">
          <div class="form-mode-header">
            <h2 id="profile-form-title">Profil Ekle</h2>
            <button id="profile-form-reset" class="btn ghost" type="button" style="display:none">+ Yeni Profil</button>
          </div>
          <div class="parser">
            <h3>Yapıştır ve Ayrıştır</h3>
            <textarea id="parse-input" rows="8" placeholder="Metni buraya yapıştırın..."></textarea>
            <label>Aktif dava seç
              <select id="active-case"></select>
            </label>
            <div class="parser-actions">
              <button id="parse-btn" class="btn primary" type="button">Ayrıştır</button>
              <button id="clear-btn" class="btn ghost" type="button">Temizle</button>
            </div>
            <div id="parse-results" class="list"></div>
          </div>
          <form id="profile-form">
            <input type="hidden" name="editId" />
            <div class="profile-header-section">
              <label>İsim Soyad<input name="name" required /></label>
              <div class="form-grid">
                <label>Kurum<input name="organization" placeholder="Örn: Emniyet Genel Müdürlüğü" /></label>
                <label>Ünvan<input name="title" placeholder="Örn: Komiser Yardımcısı" /></label>
              </div>
              <label>Savcılık Suçlamaları<textarea name="summary" rows="3"></textarea></label>
              <div class="form-grid">
                <label>Toplam Talep Edilen Ceza<input name="sentenceDemand" /></label>
                <label>Rol
                  <select name="role">
                    <option value="defendant">Sanık</option>
                    <option value="informant">İtirafçı</option>
                    <option value="witness">Tanık</option>
                    <option value="secretWitness">Gizli Tanık</option>
                    <option value="victim">Mağdur</option>
                    <option value="fugitive">Firari</option>
                    <option value="detained">Tutuklu</option>
                  </select>
                </label>
              </div>
              <label>Suçlanılan Kanun Maddeleri
                <div class="tck-input-row">
                  <input id="tck-input" placeholder="Örn: TCK 314/2" />
                  <button type="button" id="tck-add-btn" class="btn ghost">Ekle</button>
                </div>
                <div id="tck-chips" class="chips-container"></div>
              </label>
              <label>Suçlanan Eylemler
                <div class="tck-input-row">
                  <input id="action-input" placeholder="Örn: Eylem 3" />
                  <button type="button" id="action-add-btn" class="btn ghost">Ekle</button>
                </div>
                <div id="action-chips" class="chips-container"></div>
              </label>
              <label>Fotoğraf URL<input name="photo" placeholder="https://..." /></label>
            </div>
            <h3 class="accusations-heading">Suçlamalar</h3>
            <div id="actions-container"></div>
            <button class="btn primary" type="submit">Kaydet</button>
          </form>
          <div class="list" id="profile-list"></div>
        </section>

      </main>
    </div>

    <script src="/admin/admin.js"></script>
  </body>
</html>
