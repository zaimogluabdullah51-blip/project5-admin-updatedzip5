<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin · CourtCase Clarity</title>
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/admin/admin.css" />
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-Y6TM91Z6JY"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-Y6TM91Z6JY');
    </script>
  </head>
  <body class="admin-body">
    <header class="admin-header">
      <div>
        <p class="eyebrow">CourtCase Clarity</p>
        <h1>Admin Control Room</h1>
        <p class="muted">Log new cases, manage people, and link profiles to dossiers.</p>
      </div>
      <div class="header-actions">
        <button id="logout" class="btn ghost">Log out</button>
      </div>
    </header>

    <main class="admin-grid">
      <section class="card">
        <h2>New case</h2>
        <form id="case-form">
          <label>
            Title
            <input name="title" required />
          </label>
          <label>
            Summary
            <textarea name="summary" rows="3"></textarea>
          </label>
          <div class="form-grid">
            <label>
              Case number
              <input name="case_number" />
            </label>
            <label>
              Court name
              <input name="court_name" />
            </label>
            <label>
              Judge
              <input name="judge" />
            </label>
            <label>
              Court panel
              <input name="court_panel" placeholder="Başkan: ... · Üye: ... · Üye: ..." />
            </label>
            <label>
              Prosecutor
              <input name="prosecutor" />
            </label>
            <label>
              Hearing count
              <input name="hearing_count" type="number" min="0" />
            </label>
          </div>
          <div class="form-grid">
            <label>
              Start date
              <input name="start_date" type="date" />
            </label>
            <label>
              Last hearing
              <input name="last_hearing_date" type="date" />
            </label>
            <label>
              Incident
              <input name="incident" />
            </label>
            <label>
              Dossier
              <input name="dossier" />
            </label>
            <label>
              Date
              <input name="date" type="date" />
            </label>
            <label>
              Status
              <input name="status" />
            </label>
          </div>
          <label>
            TCK articles (one per line: 314/2|Silahlı Örgüt Üyeliği)
            <textarea name="tck_articles" rows="3"></textarea>
          </label>
          <button class="btn primary" type="submit">Save case</button>
          <p id="case-status" class="status"></p>
        </form>
      </section>

      <section class="card">
        <h2>New person</h2>
        <form id="person-form">
          <label>
            Name
            <input name="name" required />
          </label>
          <div class="form-grid">
            <label>
              Role
              <input name="role" />
            </label>
            <label>
              Relationship
              <input name="relationship" />
            </label>
          </div>
          <label>
            Charge(s)
            <input name="charge" />
          </label>
          <label>
            Photo URL
            <input name="photo_url" type="url" />
          </label>
          <label>
            TCK codes (comma separated)
            <input name="tck_articles" placeholder="314/2, 299" />
          </label>
          <label>
            Accusations (one per line)
            <textarea name="accusations" rows="2"></textarea>
          </label>
          <label>
            Evidence (one per line: type|description|reference)
            <textarea name="evidence_items" rows="2"></textarea>
          </label>
          <label>
            Defense (one per line)
            <textarea name="defense" rows="2"></textarea>
          </label>
          <label>
            Related profiles
            <select name="related_profiles" id="related-profiles" multiple></select>
          </label>
          <div class="form-grid">
            <label>
              Superiors
              <select name="superiors" id="superiors" multiple></select>
            </label>
            <label>
              Subordinates
              <select name="subordinates" id="subordinates" multiple></select>
            </label>
          </div>
          <label class="checkbox">
            <input name="is_external" type="checkbox" />
            External person (not a defendant)
          </label>
          <label>
            Assign to case
            <select name="caseId" id="person-case"></select>
          </label>
          <button class="btn primary" type="submit">Save person</button>
          <p id="person-status" class="status"></p>
        </form>
      </section>

      <section class="card">
        <h2>Link existing profiles</h2>
        <form id="link-form">
          <label>
            Case
            <select name="caseId" id="link-case"></select>
          </label>
          <label>
            Person
            <select name="personId" id="link-person"></select>
          </label>
          <label>
            Relationship
            <input name="relationship" />
          </label>
          <button class="btn primary" type="submit">Create link</button>
          <p id="link-status" class="status"></p>
        </form>
      </section>

      <section class="card">
        <h2>Current cases</h2>
        <div id="case-list" class="list"></div>
      </section>

      <section class="card">
        <h2>People directory</h2>
        <div id="person-list" class="list"></div>
      </section>
    </main>

    <script src="/admin/admin.js"></script>
  </body>
</html>
